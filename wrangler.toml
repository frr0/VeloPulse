# Cloudflare Worker for the web app: static assets + /api backend (Strava).
#
# Until a custom domain exists the app runs on <name>.<account>.workers.dev.
# Changing `name` changes that URL, so update the Strava callback domain too.
name = "velopulse"
main = "worker/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, SPA fallback would answer /api/* with index.html.
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, STRAVA_STATE_SECRET,
#   STRAVA_WEBHOOK_VERIFY_TOKEN, STRAVA_WEBHOOK_SUBSCRIPTION_ID (optional),
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
